name: Build My Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'drivers/**'
      - 'internal/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'Dockerfile'
      - '.github/workflows/build-fix.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/the-go/openlist

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
